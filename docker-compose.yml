# 4cash — всё поднимается одной командой:  docker compose up -d --build
# Для разработки только инфраструктура:      pnpm infra:up  (+ pnpm dev)
name: 4cash

# Общий шаблон сервисов бэкенда. Образ один на всех; собирает его только `init`,
# остальные берут готовый (pull_policy: never), иначе compose собирал бы один тег 9 раз параллельно.
x-backend: &backend
  image: 4cash/backend:local
  pull_policy: never
  environment:
    KAFKA_BROKERS: kafka:19092
    RABBIT_URL: amqp://guest:guest@rabbitmq:5672
    DATABASE_URL: postgres://fourcash:fourcash@postgres:5432/fourcash
  depends_on:
    init:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  # ---------------- инфраструктура ----------------
  kafka:
    image: apache/kafka:3.9.1
    container_name: 4cash-kafka
    ports:
      - "9092:9092" # для сервисов на хосте (127.0.0.1:9092)
    environment:
      # KRaft-режим: брокер и контроллер в одном процессе, без Zookeeper
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL — для контейнеров, EXTERNAL — для хоста.
      # 127.0.0.1, а не localhost: на Windows localhost может уйти в IPv6 (::1) и получить EACCES
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Один брокер => репликация 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: 4cash-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: 4cash
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      - kafka

  rabbitmq:
    image: rabbitmq:4-management
    container_name: 4cash-rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI (guest / guest)
    volumes:
      - rabbit-data:/var/lib/rabbitmq
      # + shovel: в UI у очереди появится "Move messages" (переложить из DLQ обратно)
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30

  postgres:
    image: postgres:17-alpine
    container_name: 4cash-postgres
    ports:
      - "5433:5432" # 5433 на хосте — чтобы не конфликтовать с локальным Postgres
    environment:
      POSTGRES_USER: fourcash
      POSTGRES_PASSWORD: fourcash
      POSTGRES_DB: fourcash
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fourcash -d fourcash"]
      interval: 3s
      timeout: 5s
      retries: 30

  adminer:
    image: adminer:latest
    container_name: 4cash-adminer
    ports:
      - "8081:8080" # http://localhost:8081 — PostgreSQL / server: postgres / fourcash / fourcash / db: fourcash
    depends_on:
      - postgres

  # ---------------- приложение ----------------
  # Одноразовый контейнер: схема БД, топики, очереди и seed (только в пустую базу)
  init:
    <<: *backend
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    pull_policy: build
    container_name: 4cash-init
    command: >
      sh -c "node -r ts-node/register/transpile-only -r tsconfig-paths/register scripts/setup.ts &&
             node -r ts-node/register/transpile-only -r tsconfig-paths/register scripts/seed.ts ifEmpty=1"
    depends_on:
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: "no"

  gateway:
    <<: *backend
    container_name: 4cash-gateway
    command: node -r ts-node/register/transpile-only -r tsconfig-paths/register apps/api-gateway/src/main.ts
    ports:
      - "3000:3000"

  wallet:
    <<: *backend
    container_name: 4cash-wallet
    command: node -r ts-node/register/transpile-only -r tsconfig-paths/register apps/wallet-service/src/main.ts

  roulette:
    <<: *backend
    container_name: 4cash-roulette
    command: node -r ts-node/register/transpile-only -r tsconfig-paths/register apps/roulette-service/src/main.ts

  crash:
    <<: *backend
    container_name: 4cash-crash
    command: node -r ts-node/register/transpile-only -r tsconfig-paths/register apps/crash-service/src/main.ts

  risk:
    <<: *backend
    container_name: 4cash-risk
    command: node -r ts-node/register/transpile-only -r tsconfig-paths/register apps/risk-service/src/main.ts

  leaderboard:
    <<: *backend
    container_name: 4cash-leaderboard
    command: node -r ts-node/register/transpile-only -r tsconfig-paths/register apps/leaderboard-service/src/main.ts

  payments:
    <<: *backend
    container_name: 4cash-payments
    command: node -r ts-node/register/transpile-only -r tsconfig-paths/register apps/payments-service/src/main.ts

  notifications:
    <<: *backend
    container_name: 4cash-notifications
    command: node -r ts-node/register/transpile-only -r tsconfig-paths/register apps/notifications-service/src/main.ts

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        # адрес API, по которому ходит БРАУЗЕР (а не контейнер) — поэтому localhost
        NEXT_PUBLIC_API_URL: http://localhost:3000
    image: 4cash/web:local
    container_name: 4cash-web
    ports:
      - "3001:3000"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  kafka-data:
  rabbit-data:
  pg-data:
